<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="prIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="prGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.8" />
    </linearGradient>
    <filter id="prGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Diamond / Shield -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#0F172A" stroke="url(#prIconGrad)" stroke-width="2.5" />
  
  <!-- Subtle Grid Accent -->
  <path d="M6 32h52M32 6v52" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" />
  
  <!-- Pixel blocks decor -->
  <rect x="14" y="14" width="6" height="6" rx="1.5" fill="#A855F7" opacity="0.9" />
  <rect x="22" y="14" width="6" height="6" rx="1.5" fill="#8B5CF6" opacity="0.6" />
  <rect x="44" y="44" width="6" height="6" rx="1.5" fill="#06B6D4" opacity="0.9" />
  <rect x="36" y="44" width="6" height="6" rx="1.5" fill="#0284C7" opacity="0.6" />
  
  <!-- Dynamic Stylized Gamepad / Rush Arrow Symbol -->
  <g filter="url(#prGlow)">
    <!-- Rush Arrow Right / Play Blade -->
    <path d="M22 20L44 32L22 44V20Z" fill="url(#prIconGrad)" />
    <!-- Center Pixel Energy Core -->
    <rect x="28" y="29" width="6" height="6" rx="1.5" fill="#FFFFFF" />
  </g>
  
  <!-- D-Pad Pixel Nodes on left -->
  <circle cx="17" cy="32" r="2.5" fill="#00F0FF" />
  <circle cx="47" cy="24" r="2" fill="#E879F9" />
</svg>
