<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceDeep" cx="65%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="35%" stop-color="#1E1B4B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <!-- Cosmic Nebula Glow -->
    <radialGradient id="nebulaCyan" cx="30%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="70%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Starship metallic gradient -->
    <linearGradient id="shipHull" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="25%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    
    <!-- Neon Engine Trail -->
    <linearGradient id="engineGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="80%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>

    <!-- Laser Beam -->
    <linearGradient id="laserGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos Canvas -->
  <rect width="800" height="450" fill="url(#spaceDeep)" />
  <rect width="800" height="450" fill="url(#nebulaCyan)" />
  <rect width="800" height="450" fill="url(#nebulaPurple)" />

  <!-- Distant Perspective Retro Grid -->
  <g opacity="0.25">
    <line x1="0" y1="400" x2="800" y2="400" stroke="#8B5CF6" stroke-width="1.5" />
    <line x1="0" y1="420" x2="800" y2="420" stroke="#8B5CF6" stroke-width="1.8" />
    <line x1="0" y1="440" x2="800" y2="440" stroke="#06B6D4" stroke-width="2.2" />
    <line x1="400" y1="360" x2="0" y2="450" stroke="#8B5CF6" stroke-width="1.2" />
    <line x1="400" y1="360" x2="160" y2="450" stroke="#8B5CF6" stroke-width="1.2" />
    <line x1="400" y1="360" x2="320" y2="450" stroke="#8B5CF6" stroke-width="1.2" />
    <line x1="400" y1="360" x2="480" y2="450" stroke="#8B5CF6" stroke-width="1.2" />
    <line x1="400" y1="360" x2="640" y2="450" stroke="#8B5CF6" stroke-width="1.2" />
    <line x1="400" y1="360" x2="800" y2="450" stroke="#8B5CF6" stroke-width="1.2" />
  </g>

  <!-- Distant Stars Field -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="85" cy="54" r="1.2" />
    <circle cx="160" cy="120" r="1.8" opacity="0.9" />
    <circle cx="240" cy="45" r="1.5" />
    <circle cx="310" cy="180" r="1" />
    <circle cx="390" cy="70" r="2" opacity="0.7" />
    <circle cx="480" cy="110" r="1.3" />
    <circle cx="560" cy="40" r="1.7" />
    <circle cx="680" cy="95" r="2.2" filter="url(#softGlow)" />
    <circle cx="740" cy="160" r="1.1" />
    <circle cx="120" cy="280" r="1.4" />
    <circle cx="190" cy="340" r="1.8" opacity="0.6" />
    <circle cx="610" cy="310" r="1.5" />
    <circle cx="720" cy="360" r="1.6" />
  </g>
  <!-- Twinkle Cross Stars -->
  <g stroke="#00F0FF" stroke-width="1.2" opacity="0.75" filter="url(#softGlow)">
    <line x1="140" y1="70" x2="140" y2="82" />
    <line x1="134" y1="76" x2="146" y2="76" />
    <line x1="680" y1="60" x2="680" y2="76" stroke="#C084FC" stroke-width="1.5" />
    <line x1="672" y1="68" x2="688" y2="68" stroke="#C084FC" stroke-width="1.5" />
  </g>

  <!-- Asteroids Field -->
  <!-- Asteroid 1 (Background left) -->
  <polygon points="110,180 145,160 180,185 170,225 125,240 100,210" fill="#1E293B" stroke="#64748B" stroke-width="1.5" opacity="0.7" />
  <line x1="125" y1="185" x2="155" y2="210" stroke="#334155" stroke-width="1.5" />
  
  <!-- Asteroid 2 (Foreground right, with purple rim light) -->
  <polygon points="660,260 720,230 770,270 755,330 690,350 645,310" fill="#0F172A" stroke="#A855F7" stroke-width="2.5" filter="url(#softGlow)" />
  <polygon points="665,265 715,238 760,272 748,324 692,342 652,308" fill="#182032" />
  <circle cx="700" cy="290" r="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <circle cx="730" cy="310" r="5" fill="#0F172A" stroke="#334155" stroke-width="1" />

  <!-- Asteroid 3 (Small tumbling shard) -->
  <polygon points="260,320 290,305 305,330 280,345" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Laser Projectiles -->
  <g filter="url(#bloom)">
    <rect x="460" y="196" width="130" height="4" rx="2" fill="url(#laserGrad)" transform="rotate(-6 460 196)" />
    <rect x="440" y="226" width="140" height="4" rx="2" fill="url(#laserGrad)" transform="rotate(-6 440 226)" />
    <line x1="600" y1="180" x2="660" y2="174" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Player Space Fighter Ship -->
  <g transform="translate(300, 150) rotate(-4 100 60)">
    <!-- Engine Plasma Exhaust (Backwards) -->
    <ellipse cx="-40" cy="58" rx="75" ry="14" fill="url(#engineGlow)" filter="url(#bloom)" opacity="0.9" />
    <ellipse cx="-20" cy="58" rx="40" ry="7" fill="#FFFFFF" filter="url(#softGlow)" />
    
    <!-- Ship Shadow / Aura -->
    <path d="M-10 60 L140 58 L50 20 L-20 30 Z" fill="#7C3AED" opacity="0.3" filter="url(#bloom)" />
    
    <!-- Left Wing (Top perspective) -->
    <polygon points="10,25 70,50 10,60 -15,50" fill="#334155" stroke="#64748B" stroke-width="1.5" />
    <line x1="12" y1="30" x2="65" y2="50" stroke="#06B6D4" stroke-width="2" />

    <!-- Main Fuselage Body -->
    <polygon points="175,58 60,35 -15,48 -5,58 -15,68 60,81" fill="url(#shipHull)" stroke="#00F0FF" stroke-width="1.5" />

    <!-- Right Wing (Bottom perspective) -->
    <polygon points="10,91 70,66 10,56 -15,66" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <line x1="12" y1="86" x2="65" y2="66" stroke="#A855F7" stroke-width="2" />

    <!-- Cockpit Canopy (Glowing Neon Cyan) -->
    <polygon points="120,58 75,49 45,53 45,63 75,67" fill="#06B6D4" filter="url(#softGlow)" opacity="0.95" />
    <polygon points="110,58 78,52 55,55 55,61 78,64" fill="#E0F2FE" />

    <!-- Shield Arc Effect -->
    <path d="M140,25 A 70 70 0 0 1 140,91" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="8 6" opacity="0.75" filter="url(#softGlow)" />

    <!-- Wingtip Cannons -->
    <circle cx="10" cy="25" r="2.5" fill="#00F0FF" filter="url(#softGlow)" />
    <circle cx="10" cy="91" r="2.5" fill="#C084FC" filter="url(#softGlow)" />
  </g>

  <!-- Explosive Alien Drone Target (Top Right) -->
  <g transform="translate(620, 130)">
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#EF4444" opacity="0.3" filter="url(#bloom)" />
    <polygon points="0,-15 15,0 0,15 -15,0" fill="#7F1D1D" stroke="#F87171" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#FCA5A5" filter="url(#softGlow)" />
    <!-- Impact Sparks -->
    <circle cx="-12" cy="-8" r="2" fill="#FEF08A" />
    <circle cx="14" cy="10" r="1.5" fill="#FEF08A" />
  </g>

  <!-- Modern Vignette Overlay -->
  <rect width="800" height="450" fill="none" stroke="#1E1B4B" stroke-width="8" opacity="0.4" />

  <!-- Cinematic Bottom Banner Overlay -->
  <rect x="0" y="360" width="800" height="90" fill="url(#spaceDeep)" opacity="0.88" />
  
  <!-- Category Badge -->
  <rect x="36" y="380" width="138" height="26" rx="6" fill="#7C3AED" fill-opacity="0.25" stroke="#A855F7" stroke-width="1.2" />
  <circle cx="48" cy="393" r="3" fill="#22D3EE" />
  <text x="58" y="397" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#E9D5FF">ACTION / SURVIVAL</text>

  <!-- Playable Indicator Badge -->
  <rect x="184" y="380" width="85" height="26" rx="6" fill="#059669" fill-opacity="0.2" stroke="#10B981" stroke-width="1.2" />
  <circle cx="196" cy="393" r="3.5" fill="#10B981" />
  <text x="206" y="397" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#34D399">PLAYABLE</text>

  <!-- Big Title -->
  <text x="36" y="432" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="1" fill="#FFFFFF">
    SPACE SURVIVOR
  </text>
</svg>
