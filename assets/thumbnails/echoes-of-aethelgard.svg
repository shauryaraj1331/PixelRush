<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="adventureSky" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="35%" stop-color="#1E1B4B" />
      <stop offset="75%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Aurora borealis gradient -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="25%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="crystalGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="advGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#adventureSky)" />

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="90" cy="60" r="1.2" />
    <circle cx="210" cy="40" r="1.5" />
    <circle cx="340" cy="80" r="1" />
    <circle cx="580" cy="50" r="1.4" />
    <circle cx="710" cy="90" r="1.8" />
  </g>

  <!-- Aurora Waves -->
  <path d="M0,130 Q200,60 400,120 T800,100 L800,220 Q600,160 400,180 T0,200 Z" fill="url(#aurora)" filter="url(#advGlow)" />

  <!-- Giant Crescent Celestial Moon -->
  <path d="M620,60 A 45 45 0 0 0 660,140 A 35 35 0 0 1 620,60 Z" fill="#F8FAFC" opacity="0.8" filter="url(#advGlow)" />

  <!-- Floating Island 1 (Distant Left) -->
  <polygon points="120,200 180,190 220,205 180,240 140,230" fill="#1E293B" opacity="0.7" />
  <polygon points="160,185 170,170 175,185" fill="#38BDF8" opacity="0.8" />

  <!-- Floating Island 2 (Distant Right) -->
  <polygon points="580,220 660,210 700,225 640,265 600,250" fill="#1E293B" opacity="0.7" />

  <!-- Main Floating Island (Center Foreground) -->
  <g transform="translate(400, 260)">
    <!-- Island Rock Base -->
    <polygon points="-180,0 -80,-15 100,-12 190,4 120,80 10,120 -110,75" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <!-- Grass / Moss Edge -->
    <path d="M-180,0 Q-100,-15 0,-12 Q100,-10 190,4 L185,15 Q95,0 0,-2 Q-95, -2 -175,12 Z" fill="#065F46" />
    <path d="M-175,2 Q-90,-12 0,-10 Q90,-8 185,6" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8" />

    <!-- Giant Glowing Mystic Monolith Crystal -->
    <g transform="translate(60, -70)">
      <polygon points="0,-75 22,-15 15,45 -15,45 -22,-15" fill="url(#crystalGlow)" filter="url(#advGlow)" />
      <polygon points="0,-75 0,45 15,45 22,-15" fill="#E0E7FF" opacity="0.4" />
      <!-- Runes circling crystal -->
      <circle cx="0" cy="-15" r="32" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="6 4" opacity="0.8" />
      <circle cx="0" cy="-15" r="42" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="10 6" opacity="0.6" />
    </g>

    <!-- Ancient Stone Pillars Ruins -->
    <rect x="-80" y="-45" width="14" height="40" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <rect x="-120" y="-35" width="12" height="30" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <rect x="-86" y="-50" width="26" height="6" rx="1" fill="#334155" />

    <!-- Adventurer Silhouette with Glowing Sword -->
    <g transform="translate(-10, -28)">
      <!-- Cloak & Body -->
      <path d="M-8,15 L-5,-2 L0,-8 L5,-2 L8,15 Z" fill="#020617" />
      <!-- Head -->
      <circle cx="0" cy="-12" r="4" fill="#020617" />
      <!-- Scarf fluttering -->
      <path d="M-3,-9 Q-12,-15 -20,-10 Q-15,-6 -5,-7" fill="#8B5CF6" />
      <!-- Glowing Ancient Blade -->
      <line x1="8" y1="5" x2="16" y2="-22" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" filter="url(#advGlow)" />
      <line x1="8" y1="5" x2="16" y2="-22" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Details Overlay -->
  <rect x="0" y="360" width="800" height="90" fill="#090D16" opacity="0.88" />
  
  <!-- Category Badge -->
  <rect x="36" y="380" width="112" height="26" rx="6" fill="#059669" fill-opacity="0.2" stroke="#34D399" stroke-width="1.2" />
  <circle cx="48" cy="393" r="3" fill="#10B981" />
  <text x="58" y="397" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#A7F3D0">ADVENTURE</text>

  <!-- Coming Soon Badge -->
  <rect x="158" y="380" width="112" height="26" rx="6" fill="#F59E0B" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1.2" />
  <circle cx="170" cy="393" r="3.5" fill="#F59E0B" />
  <text x="180" y="397" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#FDE68A">COMING SOON</text>

  <!-- Title -->
  <text x="36" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="1" fill="#FFFFFF">
    ECHOES OF AETHELGARD
  </text>
</svg>
